[package]
name = "local-live-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
opus = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.14"

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
